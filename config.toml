baseURL = 'https://www.mountaindreamercounseling.com/'
title = 'Mountain Dreamer Counseling'
enablerobotstxt = true
enableGitInfo = true
timezone = "America/Denver"
titlecasestyle = "Go"
disableKinds = ["taxonomy", "term"]

[languages.en]
copyright = "© Cassi Stuckman"
locale = "en-us"
direction = "ltr"
label = "English"
weight = 10

[params]
description = "Mountain Dreamer Counseling offers somatic therapy, dreamwork, perinatal support, and addiction recovery counseling in Boulder, Colorado. LPC Cassi Stuckman — now accepting new clients."
# Contact details. This is the single source for the contact section, footer, enrollment
# banner, structured data, and the {{< phone >}} / {{< email >}} shortcodes.
phone = "(303) 800-7572"
email = "info@mountaindreamercounseling.com"

# Profiles elsewhere: the footer's Instagram link and the structured data's sameAs lists.
[params.social]
instagram = "https://www.instagram.com/cassisoma/"
psychology_today = "https://www.psychologytoday.com/us/therapists/cassi-stuckman-longmont-co/1280630"

[markup.goldmark.renderer]
unsafe = true

# Also mount static/images into assets so templates can resize and convert those images
# with Hugo's image processing; the originals are still published unchanged. Defining any
# mount replaces the defaults for its target, hence the explicit assets and static entries.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
