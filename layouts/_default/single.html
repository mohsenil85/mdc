{{ define "main" }}
  <article class="post wrap">
    <header class="post-header">
      <p class="eyebrow">Dream Journal</p>
      <h1>{{ .Title }}</h1>
      <p class="post-meta">
        {{ .Date.Format "January 2, 2006" }}{{ with .Params.author }} <span class="footer-sep">&middot;</span> {{ . }}{{ end }}
      </p>
    </header>

    <div class="post-body">
      {{ .Content }}
    </div>

    <footer class="post-footer">
      {{ if eq .Section "posts" }}{{ partial "author-box.html" . }}{{ end }}
      <p class="post-more"><a href="/posts/" class="post-readmore">More from the Dream Journal &rarr;</a></p>
    </footer>
  </article>
{{ end }}
