{{ $contact := .Site.GetPage "/sections/contact" }}
{{ if $contact }}
<section class="cta" id="book">
  <div class="wrap cta-inner">
    <div class="cta-head">
      <p class="eyebrow eyebrow-dawn">Free consultation</p>
      <h2>{{ $contact.Title }}</h2>
    </div>
    <div class="contact-content">
      {{ $contact.Content }}
      <a class="btn btn-dawn cta-button" href="mailto:{{ site.Params.email }}?subject=Free%20consultation">Book a free consultation</a>
    </div>

    <aside class="contact-info">
      <p class="contact-info-title">Get in touch</p>
      <p class="contact-line">
        <span class="contact-label">Email</span>
        <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
      </p>
      <p class="contact-line">
        <span class="contact-label">Phone</span>
        <a href="tel:{{ partial "phone-e164.html" . }}">{{ site.Params.phone }}</a>
      </p>
    </aside>
  </div>
</section>
{{ end }}
